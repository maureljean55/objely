<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Apparence - Objely</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-primary": "#adc6ff",
                        "on-error-container": "#93000a",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed-variant": "#45474b",
                        "on-tertiary-fixed": "#1a1c1f",
                        "on-secondary-fixed": "#0c006a",
                        "inverse-on-surface": "#f3f0f2",
                        "on-tertiary": "#ffffff",
                        "on-surface-variant": "#414755",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed-variant": "#3631b4",
                        "surface-container": "#f0edef",
                        "secondary-fixed-dim": "#c2c1ff",
                        "surface-container-highest": "#e4e2e4",
                        "primary-fixed-dim": "#adc6ff",
                        "surface-tint": "#005bc1",
                        "tertiary-fixed-dim": "#c6c6cb",
                        "on-secondary-container": "#fffbff",
                        "on-tertiary-container": "#fdfcff",
                        "error-container": "#ffdad6",
                        "surface-dim": "#dcd9dc",
                        "on-primary-fixed": "#001a41",
                        "surface": "#fcf8fb",
                        "primary": "#0058bc",
                        "on-surface": "#1b1b1d",
                        "surface-container-lowest": "#ffffff",
                        "on-primary": "#ffffff",
                        "primary-fixed": "#d8e2ff",
                        "on-background": "#1b1b1d",
                        "surface-container-high": "#eae7ea",
                        "inverse-surface": "#303032",
                        "tertiary-container": "#737479",
                        "outline-variant": "#c1c6d7",
                        "primary-container": "#0070eb",
                        "on-primary-container": "#fefcff",
                        "tertiary-fixed": "#e2e2e7",
                        "background": "#fcf8fb",
                        "on-primary-fixed-variant": "#004493",
                        "surface-container-low": "#f6f3f5",
                        "surface-variant": "#e4e2e4",
                        "secondary-container": "#6664e4",
                        "tertiary": "#5a5c60",
                        "secondary": "#4c4aca",
                        "secondary-fixed": "#e2dfff",
                        "surface-bright": "#fcf8fb",
                        "error": "#ba1a1a",
                        "outline": "#717786"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "20px",
                        "lg": "24px",
                        "xs": "8px",
                        "md": "16px",
                        "sm": "12px",
                        "base": "4px",
                        "gutter": "16px",
                        "xl": "32px",
                        "safe-area": "env(safe-area-inset-bottom, 20px)"
                    },
                    "fontFamily": {
                        "title-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "caption": ["Inter"],
                        "label-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "display": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "title-md": ["20px", { "lineHeight": "25px", "fontWeight": "600" }],
                        "headline-lg": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "caption": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "label-md": ["13px", { "lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "body-lg": ["17px", { "lineHeight": "22px", "fontWeight": "400" }],
                        "display": ["34px", { "lineHeight": "41px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "30px", "fontWeight": "700" }],
                        "body-sm": ["15px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom toggle switch styling based on iOS pattern */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #005bc1; /* primary surface-tint */
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #0070eb; /* primary-container */
        }
        .toggle-checkbox:checked + .toggle-label:after {
            transform: translateX(100%);
            border-color: white;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased pb-24">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-14 bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-xl border-b border-outline-variant/30 dark:border-outline/20">
<button class="w-10 h-10 flex items-center justify-start text-on-surface hover:opacity-70 transition-opacity active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="arrow_back_ios">arrow_back_ios</span>
</button>
<h1 class="text-title-md font-title-md text-on-surface truncate flex-1 text-center">Apparence</h1>
<div class="w-10 h-10"></div> <!-- Spacer to center title -->
</header>
<!-- Main Content -->
<main class="flex-1 mt-14 px-margin-mobile pt-lg max-w-2xl mx-auto w-full">
<div class="mb-xl">
<p class="text-body-lg font-body-lg text-on-surface-variant mb-md">Personnalisez l'apparence de l'application selon vos préférences.</p>
</div>
<!-- Selection Cards (Bento/Vertical Layout) -->
<div class="flex flex-col gap-md mb-xl">
<!-- Card 1: Clair (Selected) -->
<button class="w-full text-left bg-surface-container-lowest rounded-xl p-md border-[1.5px] border-primary shadow-[0_4px_20px_rgba(0,0,0,0.05)] relative overflow-hidden active:scale-[0.98] transition-transform duration-200">
<div class="absolute top-md right-md">
<span class="material-symbols-outlined icon-fill text-primary" data-icon="check_circle">check_circle</span>
</div>
<div class="flex items-start gap-md">
<!-- Preview Graphic -->
<div class="w-24 h-32 bg-surface-container rounded-lg border border-outline-variant/30 flex flex-col p-2 shrink-0">
<div class="w-full h-3 bg-surface-container-highest rounded-full mb-2"></div>
<div class="w-3/4 h-2 bg-surface-container-high rounded-full mb-1"></div>
<div class="w-1/2 h-2 bg-surface-container-high rounded-full mt-auto"></div>
</div>
<div class="flex flex-col justify-center py-2">
<div class="flex items-center gap-xs mb-1">
<span class="material-symbols-outlined text-on-surface icon-fill" data-icon="light_mode">light_mode</span>
<h2 class="text-title-md font-title-md text-on-surface">Clair</h2>
</div>
<p class="text-body-sm font-body-sm text-on-surface-variant">Utiliser le mode clair en permanence.</p>
</div>
</div>
</button>
<!-- Card 2: Sombre -->
<button class="w-full text-left bg-surface-container-lowest rounded-xl p-md border border-outline-variant/30 shadow-[0_4px_20px_rgba(0,0,0,0.05)] hover:bg-surface-container-low transition-colors active:scale-[0.98] duration-200">
<div class="flex items-start gap-md">
<!-- Preview Graphic (Dark) -->
<div class="w-24 h-32 bg-[#1b1b1d] rounded-lg border border-outline-variant/30 flex flex-col p-2 shrink-0">
<div class="w-full h-3 bg-[#303032] rounded-full mb-2"></div>
<div class="w-3/4 h-2 bg-[#414755] rounded-full mb-1"></div>
<div class="w-1/2 h-2 bg-[#414755] rounded-full mt-auto"></div>
</div>
<div class="flex flex-col justify-center py-2">
<div class="flex items-center gap-xs mb-1">
<span class="material-symbols-outlined text-on-surface" data-icon="dark_mode">dark_mode</span>
<h2 class="text-title-md font-title-md text-on-surface">Sombre</h2>
</div>
<p class="text-body-sm font-body-sm text-on-surface-variant">Idéal pour les environnements peu éclairés.</p>
</div>
</div>
</button>
<!-- Card 3: Automatique -->
<button class="w-full text-left bg-surface-container-lowest rounded-xl p-md border border-outline-variant/30 shadow-[0_4px_20px_rgba(0,0,0,0.05)] hover:bg-surface-container-low transition-colors active:scale-[0.98] duration-200">
<div class="flex items-start gap-md">
<!-- Preview Graphic (Auto - Split) -->
<div class="w-24 h-32 rounded-lg border border-outline-variant/30 flex shrink-0 overflow-hidden relative">
<div class="w-1/2 h-full bg-surface-container p-2 flex flex-col">
<div class="w-full h-2 bg-surface-container-highest rounded-full mb-1"></div>
</div>
<div class="w-1/2 h-full bg-[#1b1b1d] p-2 flex flex-col">
<div class="w-full h-2 bg-[#303032] rounded-full mb-1"></div>
</div>
<div class="absolute inset-0 bg-gradient-to-tr from-transparent via-transparent to-surface-variant/20"></div>
</div>
<div class="flex flex-col justify-center py-2">
<div class="flex items-center gap-xs mb-1">
<span class="material-symbols-outlined text-on-surface" data-icon="brightness_auto">brightness_auto</span>
<h2 class="text-title-md font-title-md text-on-surface">Automatique</h2>
</div>
<p class="text-body-sm font-body-sm text-on-surface-variant">S'adapte automatiquement selon les réglages de votre appareil.</p>
</div>
</div>
</button>
</div>
<!-- System Settings Toggle -->
<div class="bg-surface-container-lowest rounded-xl p-md border border-outline-variant/30 shadow-[0_4px_20px_rgba(0,0,0,0.05)] flex items-center justify-between mb-xl">
<div>
<h3 class="text-body-lg font-body-lg text-on-surface font-medium">Utiliser le réglage de l'appareil</h3>
<p class="text-caption font-caption text-on-surface-variant mt-1">L'application suivra le thème global de votre téléphone.</p>
</div>
<!-- iOS Style Toggle -->
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-surface-variant appearance-none cursor-pointer z-10 transition-transform duration-200 ease-in-out" id="toggle1" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-variant cursor-pointer transition-colors duration-200 ease-in-out" for="toggle1"></label>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pt-2 pb-safe-area h-16 bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-xl rounded-t-xl border-t border-outline-variant/30 dark:border-outline/20 md:hidden">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors active:scale-90 duration-200 w-16 rounded-lg py-1">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="text-label-md font-label-md">Accueil</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors active:scale-90 duration-200 w-16 rounded-lg py-1">
<span class="material-symbols-outlined mb-1" data-icon="search">search</span>
<span class="text-label-md font-label-md">Recherche</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors active:scale-90 duration-200 w-16 rounded-lg py-1">
<span class="material-symbols-outlined mb-1" data-icon="notifications">notifications</span>
<span class="text-label-md font-label-md">Activité</span>
</button>
<!-- Active Tab: Profil -->
<button class="flex flex-col items-center justify-center text-primary dark:text-inverse-primary hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors active:scale-90 duration-200 w-16 rounded-lg py-1">
<span class="material-symbols-outlined mb-1 icon-fill" data-icon="person">person</span>
<span class="text-label-md font-label-md font-semibold">Profil</span>
</button>
</nav>
</body></html>
