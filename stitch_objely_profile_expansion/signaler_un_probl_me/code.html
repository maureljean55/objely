<!DOCTYPE html>

<html lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Signaler un problème - Objely</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                    "tertiary-fixed-dim": "#c6c6cb",
                    "on-secondary-container": "#fffbff",
                    "on-tertiary-container": "#fdfcff",
                    "error-container": "#ffdad6",
                    "surface-dim": "#dcd9dc",
                    "on-primary-fixed": "#001a41",
                    "surface": "#fcf8fb",
                    "primary": "#0058bc",
                    "on-surface": "#1b1b1d",
                    "surface-container-lowest": "#ffffff",
                    "on-primary": "#ffffff",
                    "primary-fixed": "#d8e2ff",
                    "on-background": "#1b1b1d",
                    "surface-container-high": "#eae7ea",
                    "inverse-surface": "#303032",
                    "tertiary-container": "#737479",
                    "outline-variant": "#c1c6d7",
                    "primary-container": "#0070eb",
                    "on-primary-container": "#fefcff",
                    "tertiary-fixed": "#e2e2e7",
                    "background": "#fcf8fb",
                    "on-primary-fixed-variant": "#004493",
                    "surface-container-low": "#f6f3f5",
                    "surface-variant": "#e4e2e4",
                    "secondary-container": "#6664e4",

            "spacing": {

                    "lg": "24px",
                    "xs": "8px",
                    "md": "16px",
                    "sm": "12px",

                    "xl": "32px"
            },
            "fontFamily": {

                    "headline-lg": ["Inter"],

                    "caption": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],

                    "body-sm": ["15px", {"lineHeight": "20px", "fontWeight": "400"}]

          }
        }
      }

<style>
        body {
            background-color: #F2F2F7;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.05);
        }
        
        /* Custom Select Styling */
        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
        .select-wrapper {
            position: relative;
        }
        .select-wrapper::after {
            content: "expand_more";
            font-family: 'Material Symbols Outlined';
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: #717786; /* outline */
        }
    </style>
</head>
<body class="text-on-surface min-h-screen pb-32 md:pb-0">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-14 bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-xl border-b border-outline-variant/30 dark:border-outline/20">
<button aria-label="Go back" class="hover:opacity-70 transition-opacity active:scale-95 transition-transform duration-150 p-2 -ml-2 text-primary dark:text-inverse-primary">
<span class="material-symbols-outlined" data-icon="arrow_back_ios">arrow_back_ios</span>
</button>
<h1 class="text-title-md font-title-md text-on-surface">Signaler un problème</h1>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content -->
<main class="pt-20 px-margin-mobile max-w-2xl mx-auto">
<div class="mb-8">
<p class="text-body-lg font-body-lg text-on-surface-variant">
                Votre signalement nous aide à améliorer Objely.
            </p>
</div>
<form class="space-y-6">
<!-- Category Selection -->
<div class="glass-card rounded-xl p-4">
<label class="block text-label-md font-label-md text-on-surface-variant mb-2" for="category">Sélectionner une catégorie</label>
<div class="select-wrapper">
<select class="w-full bg-surface-container-lowest border border-outline-variant/50 text-on-surface text-body-lg font-body-lg rounded-lg px-4 py-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="category" name="category">
<option disabled="" selected="" value="">Choisissez une option...</option>
<option value="tech">Problème technique</option>
<option value="fake">Faux objet</option>
<option value="info">Mauvaise information</option>
<option value="other">Autre</option>
</select>
</div>
</div>
<!-- Select Related Object (Optional/Contextual) -->
<button class="w-full glass-card rounded-xl p-4 flex items-center justify-between active:scale-[0.98] transition-transform duration-150" type="button">
<div class="flex items-center gap-3 text-on-surface">
<span class="material-symbols-outlined text-primary bg-primary/10 p-2 rounded-full" data-icon="inventory_2">inventory_2</span>
<span class="text-body-lg font-body-lg">Sélectionner un objet concerné</span>
</div>
<span class="material-symbols-outlined text-outline-variant" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Description Area -->
<div class="glass-card rounded-xl p-4">
<label class="block text-label-md font-label-md text-on-surface-variant mb-2" for="description">Décrivez le problème</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant/50 text-on-surface text-body-lg font-body-lg rounded-lg px-4 py-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors resize-none" id="description" name="description" placeholder="Expliquez-nous ce qui s'est passé..." rows="5"></textarea>
</div>
<!-- Add Screenshot Button -->
<button class="w-full border-2 border-dashed border-primary/30 bg-primary/5 rounded-xl p-4 flex flex-col items-center justify-center gap-2 text-primary hover:bg-primary/10 transition-colors active:scale-[0.98]" type="button">
<span class="material-symbols-outlined text-[32px]" data-icon="add_photo_alternate">add_photo_alternate</span>
<span class="text-label-md font-label-md">Ajouter une capture d'écran</span>
</button>
<!-- Submit Action -->
<div class="pt-6">
<button class="w-full bg-primary text-on-primary text-title-md font-title-md py-4 rounded-full shadow-[0_4px_14px_0_rgba(0,88,188,0.39)] hover:bg-primary-fixed-variant active:scale-[0.98] transition-all duration-200" type="submit">
                    Envoyer le signalement
                </button>
</div>
</form>
</main>
<!-- BottomNavBar (Hidden on MD up) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pt-2 pb-safe-area h-16 bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-xl border-t border-outline-variant/30 dark:border-outline/20 rounded-t-xl md:hidden">
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors active:scale-90 transition-transform duration-200 p-2 rounded-lg min-w-[64px]" href="#">
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="home">home</span>
<span class="text-[10px] font-label-md tracking-wide">Accueil</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors active:scale-90 transition-transform duration-200 p-2 rounded-lg min-w-[64px]" href="#">
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="search">search</span>
<span class="text-[10px] font-label-md tracking-wide">Recherche</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors active:scale-90 transition-transform duration-200 p-2 rounded-lg min-w-[64px]" href="#">
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="notifications">notifications</span>
<span class="text-[10px] font-label-md tracking-wide">Activité</span>
</a>
<a class="flex flex-col items-center justify-center text-primary dark:text-inverse-primary hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors active:scale-90 transition-transform duration-200 p-2 rounded-lg min-w-[64px]" href="#">
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="person" data-weight="fill" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="text-[10px] font-label-md tracking-wide font-semibold">Profil</span>
</a>
</nav>
<!-- Support for safe area inset on iOS -->
<style>
        .pb-safe-area {
            padding-bottom: env(safe-area-inset-bottom, 16px);
        }
    </style>
</body></html>
