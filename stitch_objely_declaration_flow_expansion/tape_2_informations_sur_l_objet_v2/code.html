<style type="text/tailwindcss">

            .glass {
                @apply bg-surface/80 backdrop-blur-xl border-none;
            }
            .soft-shadow {
                box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.04);
            }
            .active-shadow {
                box-shadow: 0px 10px 30px rgba(0, 85, 255, 0.08);
            }

            }

                @apply px-4 py-2 rounded-[16px] border border-surface-container-highest bg-surface-container-lowest font-body-sm text-body-sm text-on-surface cursor-pointer transition-all hover:bg-surface-container-low;
            }

<body class="bg-background min-h-screen text-on-surface font-body-lg overflow-x-hidden selection:bg-primary/20 selection:text-primary pb-[100px]">
<!-- TopAppBar -->
<header class="glass full-width top-0 sticky z-50 flex items-center justify-between px-margin-mobile h-16 w-full text-on-surface dark:text-inverse-on-surface">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:opacity-70 transition-opacity active:scale-95 duration-150 text-on-surface-variant dark:text-surface-variant">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm">Déclarer un objet</h1>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:opacity-70 transition-opacity active:scale-95 duration-150 text-on-surface-variant dark:text-surface-variant">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
</header>
<!-- Main Content -->
<main class="px-margin-mobile pt-stack-md pb-safe-bottom">
<!-- Progress Indicator -->
<div class="flex gap-2 w-full mb-stack-lg">
<div class="h-1.5 flex-1 rounded-full bg-primary"></div>
<div class="h-1.5 flex-1 rounded-full bg-primary"></div>
<div class="h-1.5 flex-1 rounded-full bg-surface-container-high"></div>
<div class="h-1.5 flex-1 rounded-full bg-surface-container-high"></div>
</div>
<!-- Header Titles -->
<div class="mb-stack-lg">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Parlez-nous de votre objet</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Ajoutez quelques détails pour nous aider à retrouver votre objet.</p>
</div>
<!-- Photo Upload Area -->
<div class="mb-stack-lg">
<label class="input-label">Photos</label>
<div class="w-full h-48 bg-surface-container-lowest rounded-[24px] border border-dashed border-outline-variant flex flex-col items-center justify-center p-6 text-center cursor-pointer hover:bg-surface-container-low transition-colors soft-shadow relative overflow-hidden group">
<div class="absolute inset-0 bg-primary/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="material-symbols-outlined text-4xl text-primary mb-3">photo_camera</span>
<span class="font-button-text text-button-text text-primary mb-1">Ajouter une photo</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Prenez une photo ou choisissez-en une depuis votre galerie</span>
</div>
<!-- Selected Photo Thumbnail -->
<div class="mt-4 flex gap-3">
<div class="relative w-20 h-20 rounded-[16px] overflow-hidden soft-shadow border border-surface-container-highest">
<img alt="Portefeuille en cuir marron" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuALwx7nyFHK_jFbViliIP8ewWq-bMK0ohOquZJWLZv8m79uH563Ce-3h9CiVHqeMdTLvVb9qMPnjcTJ7WOLk3vcRqle_tJw1HfMNUYiEirfXBn0rsfXadduJQP8KRFELRmz5MHhdAbi9LSH1CpLiRuXT7B5-JvmMbRm9OjGlexcMKylVPDKL8SctexoQboF66l4qOa0FxVQgZzct1oiqQ-5TMrsb81opp30iEXi4uMkn0Um42iebuxZXg"/>
<button class="absolute top-1 right-1 w-6 h-6 bg-surface/80 backdrop-blur-sm rounded-full flex items-center justify-center text-on-surface hover:bg-error-container hover:text-on-error-container transition-colors">
<span class="material-symbols-outlined text-[14px]">close</span>
</button>
</div>
</div>
</div>
<!-- Form Fields -->
<form class="space-y-stack-lg flex flex-col">
<!-- Nom de l'objet -->
<div>
<label class="input-label" for="object-name">Nom de l'objet</label>
<input class="input-field soft-shadow" id="object-name" placeholder="Ex: Portefeuille" type="text" value="Portefeuille"/>
</div>
<!-- Description -->
<div>
<label class="input-label" for="object-desc">Décrivez votre objet</label>
<textarea class="input-field soft-shadow resize-none" id="object-desc" placeholder="Ex: Portefeuille en cuir véritable contenant..." rows="4"></textarea>
</div>
<!-- Marque -->
<div>
<label class="input-label" for="object-brand">Marque (Optionnel)</label>
<input class="input-field soft-shadow" id="object-brand" placeholder="Ex: Bellroy" type="text" value="Bellroy"/>
</div>
<!-- Couleur -->
<div>
<label class="input-label">Couleur principale</label>
<div class="flex flex-wrap gap-3">
<button class="chip" type="button">Noir</button>
<button class="chip" type="button">Blanc</button>
<button class="chip" type="button">Gris</button>
<button class="chip" type="button">Bleu</button>
<button class="chip" type="button">Rouge</button>
<button class="chip" type="button">Vert</button>
<button class="chip active" type="button">Marron</button>
<button class="chip" type="button">Autre</button>
</div>
</div>
<!-- Éléments distinctifs -->
<div>
<label class="input-label" for="object-distinct">Éléments distinctifs</label>
<input class="input-field soft-shadow" id="object-distinct" placeholder="Ex: rayure sur le cuir" type="text"/>
</div>
</form>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile py-stack-md pb-safe-bottom glass rounded-t-[24px]">
<button class="text-primary dark:text-inverse-primary font-button-text px-4 py-2 hover:brightness-110 transition-all active:scale-95 duration-200 flex items-center gap-2">
            Retour
        </button>
<button class="bg-primary text-on-primary rounded-xl px-6 py-3 flex items-center justify-center font-button-text hover:brightness-110 transition-all active:scale-95 duration-200 active-shadow gap-2">
            Continuer
            <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</nav>
</body></html>
