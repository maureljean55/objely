<style>
        body { background-color: #F2F2F7; } /* Base Layer */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .soft-shadow {
            box-shadow: 0px 10px 30px rgba(0, 31, 63, 0.08);
        }
        .category-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .category-card:hover {
            transform: translateY(-2px);
            box-shadow: 0px 12px 36px rgba(0, 31, 63, 0.12);
        }
        .category-card.selected {
            border-color: #007AFF;
            background-color: #f0f8ff; /* Very light blue tint */
        }
        .progress-bar-active {
            background: linear-gradient(90deg, #007AFF 0%, #A29BFE 100%);
        }
    </style>

<body class="font-body-md text-on-surface antialiased min-h-screen flex flex-col">
<!-- Top Navigation (Transactional/Task-Focused: Minimal Header) -->
<header class="w-full px-container-margin py-base flex items-center justify-between sticky top-0 z-50 bg-background/80 backdrop-blur-md">
<button aria-label="Back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high/50 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">arrow_back</span>
</button>
<div class="font-headline-sm text-headline-sm text-on-surface">Déclarer un objet</div>
<button aria-label="Close" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high/50 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">close</span>
</button>
</header>
<main class="flex-grow w-full max-w-3xl mx-auto px-container-margin pt-md pb-xl flex flex-col">
<!-- Progress Indicator -->
<div class="w-full flex items-center gap-2 mb-xl">
<div class="h-1 flex-1 rounded-full progress-bar-active"></div>
<div class="h-1 flex-1 rounded-full bg-surface-container-highest"></div>
<div class="h-1 flex-1 rounded-full bg-surface-container-highest"></div>
<div class="h-1 flex-1 rounded-full bg-surface-container-highest"></div>
</div>
<div class="text-center mb-xl">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-xs">Quel objet avez-vous perdu ?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Sélectionnez la catégorie qui correspond le mieux.</p>
</div>
<!-- Bento Grid for Categories -->
<div class="grid grid-cols-2 md:grid-cols-3 gap-md flex-grow content-start">
<!-- Category: Téléphone -->
<button class="category-card glass-panel rounded-DEFAULT p-md flex flex-col items-center justify-center aspect-square gap-3 border border-surface-container-high group focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<div class="w-14 h-14 rounded-full bg-primary-container/10 flex items-center justify-center group-hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">smartphone</span>
</div>
<span class="font-label-md text-label-md text-on-surface">Téléphone</span>
</button>
<!-- Category: Sac -->
<button class="category-card glass-panel rounded-DEFAULT p-md flex flex-col items-center justify-center aspect-square gap-3 border border-surface-container-high group focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<div class="w-14 h-14 rounded-full bg-primary-container/10 flex items-center justify-center group-hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">backpack</span>
</div>
<span class="font-label-md text-label-md text-on-surface">Sac &amp; Bagage</span>
</button>
<!-- Category: Portefeuille -->
<button class="category-card glass-panel rounded-DEFAULT p-md flex flex-col items-center justify-center aspect-square gap-3 border border-surface-container-high group focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<div class="w-14 h-14 rounded-full bg-primary-container/10 flex items-center justify-center group-hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
</div>
<span class="font-label-md text-label-md text-on-surface">Portefeuille</span>
</button>
<!-- Category: Clés -->
<button class="category-card glass-panel rounded-DEFAULT p-md flex flex-col items-center justify-center aspect-square gap-3 border border-surface-container-high group focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<div class="w-14 h-14 rounded-full bg-primary-container/10 flex items-center justify-center group-hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">key</span>
</div>
<span class="font-label-md text-label-md text-on-surface">Clés</span>
</button>
<!-- Category: Vêtements -->
<button class="category-card glass-panel rounded-DEFAULT p-md flex flex-col items-center justify-center aspect-square gap-3 border border-surface-container-high group focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<div class="w-14 h-14 rounded-full bg-primary-container/10 flex items-center justify-center group-hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">styler</span>

<div class="w-14 h-14 rounded-full bg-surface-container-high flex items-center justify-center group-hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-3xl">more_horiz</span>
</div>

<!-- Bottom Action Area (Sticky) -->
<div class="w-full fixed bottom-0 left-0 p-container-margin bg-background/90 backdrop-blur-xl border-t border-surface-container-highest z-40 pb-8">
<div class="max-w-3xl mx-auto flex gap-md">
<button class="flex-1 py-4 px-6 rounded-DEFAULT border border-[#007AFF] text-[#007AFF] font-headline-sm text-headline-sm bg-white shadow-sm hover:bg-surface-container-low transition-colors text-center">
                Annuler
            </button>
<button class="flex-[2] py-4 px-6 rounded-DEFAULT bg-[#007AFF] text-white font-headline-sm text-headline-sm shadow-[0px_4px_14px_rgba(0,122,255,0.3)] hover:opacity-90 transition-opacity bg-gradient-to-b from-white/5 to-black/5 text-center disabled:opacity-50 disabled:cursor-not-allowed">
                Continuer
            </button>
</div>
</div>
<script>
        // Simple micro-interaction for category selection
        document.querySelectorAll('.category-card').forEach(card => {
            card.addEventListener('click', function() {
                // Remove selected class from all
                document.querySelectorAll('.category-card').forEach(c => {
                    c.classList.remove('ring-2', 'ring-primary', 'bg-primary-container/5');
                    c.querySelector('.rounded-full').classList.remove('bg-primary', 'text-white');
                    c.querySelector('.material-symbols-outlined').classList.remove('text-white');
                    if(!c.querySelector('.material-symbols-outlined').classList.contains('text-on-surface-variant')) {
                         c.querySelector('.material-symbols-outlined').classList.add('text-primary');
                    }
                });
                
                // Add to clicked
                this.classList.add('ring-2', 'ring-primary', 'bg-primary-container/5');
                const iconContainer = this.querySelector('.rounded-full');
                iconContainer.classList.add('bg-primary');
                iconContainer.classList.remove('bg-primary-container/10', 'bg-surface-container-high');
                
                const icon = this.querySelector('.material-symbols-outlined');
                icon.classList.remove('text-primary', 'text-on-surface-variant');
                icon.classList.add('text-white');
            });
        });
    </script>
